<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim - Developer Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --secondary: #f59e0b;
      --text-light: #64748b;
      --text-dark: #0f172a;
      --surface: #ffffff;
      --surface-dark: #f8fafc;
      --border: #e2e8f0;
      --shadow: rgba(15, 23, 42, 0.08);
      --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-accent: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --success: #10b981;
      --error: #ef4444;
    }
.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  font-size: 1.5rem;
  font-weight: bold;
  color: #333;
  text-decoration: none;
}

.logo-img {
  width: 128px;       /* Logonun boyutu */
  height: 120px;
  margin-right: 20px; /* Yazı ile logo arası boşluk */
}
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
      background: var(--surface);
      overflow-x: hidden;
    }

    /* Modern Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      transition: all 0.3s ease;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-light);
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--accent);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--gradient-accent);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after, .nav-links a.active::after {
      width: 100%;
    }

    /* Contact Hero */
    .contact-hero {
      margin-top: 80px;
      padding: 4rem 2rem 2rem;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      text-align: center;
    }

    .hero-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-light);
      margin-bottom: 2rem;
    }

    /* Contact Section */
    .contact-section {
      padding: 4rem 2rem;
      background: var(--surface);
    }

    .contact-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    /* Contact Form */
    .contact-form {
      background: var(--surface);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px var(--shadow);
      border: 1px solid var(--border);
    }

    .form-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: var(--surface-dark);
    }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: white;
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-button {
      width: 100%;
      padding: 1rem 2rem;
      background: var(--gradient-accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .form-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    }

    .form-button:active {
      transform: translateY(0);
    }

    .form-button.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .form-button .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }

    .form-button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Contact Info */
    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .info-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 30px var(--shadow);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .info-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    .info-icon {
      width: 60px;
      height: 60px;
      background: var(--gradient-accent);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .info-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .info-text {
      color: var(--text-light);
      line-height: 1.6;
    }

    .info-text a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .info-text a:hover {
      color: var(--accent-hover);
    }

    /* Social Media */
    .social-section {
      padding: 4rem 2rem;
      background: var(--surface-dark);
      text-align: center;
    }

    .social-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .social-title {
      font-size: 2rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .social-subtitle {
      color: var(--text-light);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--text-light);
      text-decoration: none;
      font-size: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--gradient-accent);
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .social-link:hover::before {
      transform: translateY(0);
    }

    .social-link:hover {
      color: white;
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    }

    .social-link i {
      position: relative;
      z-index: 1;
    }

    /* Success/Error Messages */
    .message {
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .message.show {
      display: flex;
    }

    /* Map Section */
    .map-section {
      padding: 4rem 2rem;
      background: var(--surface);
    }

    .map-container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
    }

    .map-title {
      font-size: 2rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .map-subtitle {
      color: var(--text-light);
      margin-bottom: 2rem;
    }

    .map-placeholder {
      width: 100%;
      height: 400px;
      background: var(--surface-dark);
      border: 2px dashed var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
    }

    .map-placeholder i {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem;
      }

      .nav-links {
        gap: 1rem;
      }

      .contact-hero {
        padding: 3rem 1rem 2rem;
      }

      .contact-container {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .contact-form {
        padding: 2rem;
      }

      .social-links {
        gap: 1rem;
      }

      .social-link {
        width: 50px;
        height: 50px;
        font-size: 1.25rem;
      }

      .map-section {
        padding: 3rem 1rem;
      }

      .map-placeholder {
        height: 300px;
      }
    }

    /* Loading Animation */
    .loading-animation {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    .loading-animation.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    /* Floating Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .contact-form {
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Modern Navbar -->
<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <img src="images/devcomnavlogo.png" alt="DevCom Logo" class="logo-img">
      DevCom
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="dersler.html">Eğitimler</a></li>
      <li><a href="index.html#team">Eğitmenler</a></li>
      <li><a href="admin.html">Yönetim</a></li>
      <li><a href="pano.html">Fikir Panosu</a></li>
      <li><a href="contact.html">İletişim</a></li>
    </ul>
  </div>
</nav>

  <!-- Contact Hero -->
  <section class="contact-hero">
    <div class="hero-container loading-animation">
       
      <h1 class="hero-title">İletişime Geçin</h1>
      <p class="hero-subtitle">Sorularınız, önerileriniz veya işbirliği teklifleriniz için bize ulaşın. Size en kısa sürede dönüş yapacağız.</p>
      
      <div class="social-links">
        <a href="https://www.linkedin.com/company/developer-community-turkey" class="social-link" target="_blank">
          <i class="fab fa-linkedin"></i>
        </a>
        <a href="#" class="social-link" target="_blank">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://www.instagram.com/developercommunity2025/" class="social-link" target="_blank">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://lnkd.in/dZapKKq6" class="social-link" target="_blank">
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>
  </section>

 
  <script>
    // Smooth scrolling for navigation links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });

    // Loading animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('loaded');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.loading-animation').forEach(el => {
      observer.observe(el);
    });

    // Navbar background on scroll
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.style.background = 'rgba(255, 255, 255, 0.98)';
        navbar.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.08)';
      } else {
        navbar.style.background = 'rgba(255, 255, 255, 0.95)';
        navbar.style.boxShadow = 'none';
      }
    });

    // Contact form handling
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const form = this;
      const button = form.querySelector('.form-button');
      const buttonText = button.querySelector('.button-text');
      const successMessage = document.getElementById('success-message');
      const errorMessage = document.getElementById('error-message');
      
      // Hide messages
      successMessage.classList.remove('show');
      errorMessage.classList.remove('show');
      
      // Show loading state
      button.classList.add('loading');
      buttonText.textContent = 'Gönderiliyor...';
      
      // Simulate form submission (replace with actual form handling)
      setTimeout(() => {
        // Reset button state
        button.classList.remove('loading');
        buttonText.textContent = 'Mesaj Gönder';
        
        // Show success message (you can change this to show error based on actual response)
        successMessage.classList.add('show');
        
        // Reset form
        form.reset();
        
        // Scroll to success message
        successMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 2000);
    });

    // Add stagger animation to info cards
    const infoCards = document.querySelectorAll('.info-card');
    infoCards.forEach((card, index) => {
      card.style.animationDelay = `${index * 0.1}s`;
    });

    // Form validation
    const inputs = document.querySelectorAll('.form-input, .form-textarea');
    inputs.forEach(input => {
      input.addEventListener('blur', function() {
        if (this.value.trim() === '' && this.hasAttribute('required')) {
          this.style.borderColor = 'var(--error)';
        } else {
          this.style.borderColor = 'var(--border)';
        }
      });

      input.addEventListener('input', function() {
        if (this.style.borderColor === 'rgb(239, 68, 68)') {
          this.style.borderColor = 'var(--border)';
        }
      });
    });
  </script>
</body>
</html>
